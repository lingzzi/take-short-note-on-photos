<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ece8e2" />
    <meta
      name="description"
      content="Keep track of your workouts, one photo at a time."
    />
    <title>Gym tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="gallery" aria-label="Gym tracker">
      <header class="topbar" aria-label="Workout actions">
        <button class="icon-button" type="button" aria-label="Search workouts">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
        </button>
        <button class="icon-button" id="add-photo-button" type="button" aria-label="Open camera">
          <span class="material-symbols-rounded" aria-hidden="true">add_a_photo</span>
        </button>
      </header>

      <section class="photo-grid photo-grid--empty" aria-label="Saved workouts">
        <div class="photo-column" aria-label="Left workout column"></div>
        <div class="photo-column photo-column--offset" aria-label="Right workout column"></div>
      </section>
    </main>

    <input
      id="photo-picker"
      class="visually-hidden"
      type="file"
      accept="image/*"
      capture="environment"
      aria-label="Choose or take a workout photo"
    />

    <div class="entry-flow" id="entry-flow" hidden>
      <div class="entry-flow__content">
        <div class="entry-photo">
          <img id="entry-photo" alt="Workout photo preview" />
        </div>

        <form class="note-sheet" id="note-form">
          <label for="note-input">Write down your notes</label>
          <textarea id="note-input" name="note" rows="1" maxlength="240" placeholder="Note"></textarea>
          <button class="save-note-button" type="submit">Save</button>
        </form>

        <section class="confirmation" id="confirmation" aria-label="Confirm workout note" hidden>
          <button class="confirmation__note" id="confirmation-note" type="button" aria-label="Edit saved note">
            Note will appear here
          </button>
          <div class="confirmation__actions">
            <button class="glass-action glass-action--cancel" id="cancel-entry" type="button" aria-label="Delete and cancel">
              <span class="material-symbols-rounded" aria-hidden="true">delete</span>
            </button>
            <button class="glass-action glass-action--save" id="save-entry" type="button" aria-label="Save workout">
              <span class="material-symbols-rounded" aria-hidden="true">check</span>
            </button>
          </div>
        </section>

        <p class="flow-error" id="flow-error" role="alert" hidden></p>
      </div>
    </div>

    <p class="app-error" id="app-error" role="alert" hidden></p>
    <script src="./app.js" defer></script>
  </body>
</html>
